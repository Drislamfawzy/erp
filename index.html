<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dr.islam ERP - النظام المتكامل لإدارة المصنع</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .landing-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .logo-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 900;
            color: #f8fafc;
            margin-bottom: 8px;
        }
        p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-launch {
            display: block;
            width: 100%;
            background: #4f46e5;
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.5);
            transition: all 0.2s ease;
        }
        .btn-launch:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }
        .footer-note {
            margin-top: 25px;
            font-size: 0.7rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="landing-card">
        <div class="logo-icon">🛡️</div>
        <h1>dr.islam ERP</h1>
        <p>النظام الذكي لإدارة الفحص والصيانة والتشغيل والرقابة للمصنع</p>
        
        <!-- زر التوجيه المباشر لسيرفر جوجل سكريبت (يتجاوز تماماً مشاكل الـ CORS) -->
        <a href="https://script.google.com/macros/s/AKfycby3a7tqidBa6Hv218Rm9kC1pezsK3UVyI3_zjsKO3ASS9F81MzxolHEoiuJN5rWrWnVXg/exec"btn-launch">
            🚀 فتح النظام التشغيلي
        </a>

        <div class="footer-note">
            EIPI Factory ERP &copy; 2026 - جميع الحقوق محفوظة
        </div>
    </div>

</body>
</html>
