<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dr.islam ERP - نظام إدارة المصنع</title>
    
    <!-- ربط ملف الـ Manifest لتمكين التثبيت على سطح المكتب والهاتف -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background: #0b0f19;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .app-launch-card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 45px 35px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
        }
        .app-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: floatIcon 3s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 900;
            color: #f8fafc;
            margin-bottom: 8px;
        }
        p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-system {
            display: block;
            width: 100%;
            background: #4f46e5;
            color: #ffffff;
            text-decoration: none;
            padding: 15px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1.05rem;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.6);
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }
        .btn-system:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }
        .install-hint {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="app-launch-card">
        <div class="app-icon">🏭</div>
        <h1>dr.islam ERP</h1>
        <p>النظام الذكي لإدارة الفحص، الصيانة، والتشغيل والرقابة للمصنع</p>
        
        <!-- زر الدخول المباشر للسيرفر الحي -->
        <button onclick="launchSystem()" class="btn-system">
            🚀 تشغيل النظام الآن
        </button>

        <div class="install-hint" id="installHint" style="display: none;">
            💡 يمكنك تثبيت هذا النظام كبرنامج على سطح المكتب عبر خيارات المتصفح (Install App).
        </div>
    </div>

    <script>
        const targetUrl = "https://script.google.com/macros/s/AKfycby3a7tqidBa6Hv218Rm9kC1pezsK3UVyI3_zjsKO3ASS9F81MzxolHEoiuJN5rWrWnVXg/exec";

        function launchSystem() {
            // فتح النظام بملء الشاشة أو التوجيه المباشر لتجربة تطبيق حقيقي
            window.location.href = targetUrl;
        }

        // إظهار تلميح التثبيت إذا كان المتصفح يدعم الـ PWA
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            document.getElementById('installHint').style.display = 'block';
        });
    </script>

</body>
</html>
