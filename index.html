<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIPI Factory ERP - Live Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Cairo', sans-serif;
        }
        /* إطار هاتف موبايل وهمي أنيق يحيط بالنظام */
        .phone-frame {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 850px;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            border: 10px solid #1e293b;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        @media (max-width: 480px) {
            .phone-frame {
                border: none;
                border-radius: 0;
                max-height: 100vh;
            }
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- يتم هنا استدعاء نظامك الحي الموجود في جوجل سكريبت بالكامل دون تعديل سطر واحد -->

    </div>

</body>
</html>
